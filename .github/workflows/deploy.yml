name: GitHub Pagesへ公開

on:
  # 自動実行停止のため手動実行のみ残す。
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4
      - name: Node.jsを設定
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 依存関係をインストール
        run: npm install
      - name: アプリをビルド
        run: npm run build
      - name: GitHub Pages用アーティファクトを作成
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: GitHub Pagesへデプロイ
        id: deployment
        uses: actions/deploy-pages@v4
